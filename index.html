<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/LogoDarkmode.png" />
    <title>Hoffmeister Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              black: '#1b1b1b',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fff;
      }
      /* Hide Scrollbar Globally */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Page Entry Animation */
      .animate-enter {
        animation: enter 0.4s ease-out forwards;
        opacity: 0;
        transform: translateY(10px);
      }
      @keyframes enter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Modal/Overlay Animations (Subtle & Cool) */
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
        opacity: 0;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .animate-fade-out {
        animation: fadeOut 0.2s ease-in forwards;
        opacity: 1;
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      .animate-modal-in {
        animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: scale(0.95) translateY(15px);
      }
      @keyframes modalIn {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .animate-modal-out {
        animation: modalOut 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      @keyframes modalOut {
        to {
          opacity: 0;
          transform: scale(0.95) translateY(15px);
        }
      }

      /* Stamp Animation */
      .animate-stamp {
        animation: stamp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        opacity: 0;
        transform: scale(2) rotate(-12deg);
      }
      @keyframes stamp {
        to {
          opacity: 1;
          transform: scale(1) rotate(-12deg);
        }
      }

      /* Sticker Pop Animation */
      .animate-sticker {
        animation: stickerPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        transform-origin: bottom left;
      }
      @keyframes stickerPop {
        from {
          opacity: 0;
          transform: scale(0.8) translateY(5px) rotate(-2deg);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0) rotate(0deg);
        }
      }

      /* Stripe Pattern for In-Progress */
      .bg-stripes {
        background-image: linear-gradient(45deg, #1b1b1b 12.5%, transparent 12.5%, transparent 50%, #1b1b1b 50%, #1b1b1b 62.5%, transparent 62.5%, transparent 100%);
        background-size: 5.66px 5.66px;
        opacity: 0.1;
      }

      /* Intro Logo Animation */
      .animate-intro-logo {
        opacity: 0;
        transform: scale(0.92);
        animation: introLogo 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }
      @keyframes introLogo {
        0% {
          opacity: 0;
          transform: scale(0.92);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Page Reveal Animation */
      .animate-page-reveal {
        animation: pageReveal 0.6s ease-out forwards;
      }
      @keyframes pageReveal {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* CRT Flicker Animation */
      .animate-crt-flicker {
        animation: crtFlicker 0.15s infinite;
      }
      @keyframes crtFlicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.8; }
        94% { opacity: 1; }
      }

      /* Text Lightning Flicker */
      .animate-text-flicker {
        animation: textFlicker 3s infinite;
      }
      @keyframes textFlicker {
        0%, 100% { 
          opacity: 1; 
          text-shadow: 0 0 10px rgba(74,222,128,0.8), 0 0 20px rgba(74,222,128,0.6), 0 0 30px rgba(74,222,128,0.4);
        }
        4% { opacity: 0.9; }
        6% { opacity: 1; }
        8% { opacity: 0.85; }
        9% { opacity: 1; }
        12% { opacity: 0.9; }
        20% { opacity: 1; }
        55% { opacity: 1; }
        57% { 
          opacity: 0.7; 
          text-shadow: 0 0 5px rgba(74,222,128,0.4);
        }
        58% { 
          opacity: 1; 
          text-shadow: 0 0 15px rgba(74,222,128,1), 0 0 30px rgba(74,222,128,0.8), 0 0 45px rgba(74,222,128,0.6);
        }
        60% { opacity: 1; }
      }

      .animate-text-flicker-delayed {
        animation: textFlickerDelayed 3s infinite;
        animation-delay: 0.1s;
      }
      @keyframes textFlickerDelayed {
        0%, 100% { 
          opacity: 1; 
          text-shadow: 0 0 10px rgba(74,222,128,0.8), 0 0 20px rgba(74,222,128,0.6), 0 0 30px rgba(74,222,128,0.4);
        }
        25% { opacity: 1; }
        26% { opacity: 0.8; }
        27% { 
          opacity: 1; 
          text-shadow: 0 0 15px rgba(74,222,128,1), 0 0 30px rgba(74,222,128,0.8);
        }
        70% { opacity: 1; }
        72% { opacity: 0.7; }
        73% { opacity: 1; }
        75% { opacity: 0.85; }
        76% { opacity: 1; }
      }

      /* Rapid Image Cycle Animation */
      .animate-rapid-cycle {
        animation: rapidCycle 5s infinite;
        opacity: 0;
      }
      @keyframes rapidCycle {
        0%, 19% { opacity: 1; z-index: 10; }
        20%, 100% { opacity: 0; z-index: 0; }
      }

      /* Gradient Flow Animations */
      .gradient-container {
        background: linear-gradient(45deg, #1B1B1B, #EBE9E9, #F9F9F9, #1B1B1B);
        background-size: 400% 400%;
        animation: gradientFlow 8s ease infinite;
      }

      .gradient-overlay {
        background: radial-gradient(circle at center, transparent 0%, rgba(27, 27, 27, 0.3) 100%);
        animation: pulse 4s ease-in-out infinite;
      }

      .orb {
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.6;
      }

      .orb1 {
        animation: float1 14s ease-in-out infinite;
      }

      .orb2 {
        animation: float2 18s ease-in-out infinite;
      }

      .orb3 {
        animation: float3 16s ease-in-out infinite;
      }

      @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        25% { background-position: 100% 25%; }
        50% { background-position: 50% 100%; }
        75% { background-position: 0% 75%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        20% { transform: translate(80px, -60px) scale(1.15) rotate(15deg); }
        40% { transform: translate(-40px, 40px) scale(0.85) rotate(-10deg); }
        60% { transform: translate(100px, 80px) scale(1.2) rotate(20deg); }
        80% { transform: translate(-70px, -30px) scale(0.9) rotate(-15deg); }
      }

      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        25% { transform: translate(-90px, 70px) scale(0.8) rotate(-20deg); }
        50% { transform: translate(60px, -50px) scale(1.25) rotate(25deg); }
        75% { transform: translate(-120px, -40px) scale(0.95) rotate(-30deg); }
      }

      @keyframes float3 {
        0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        15% { transform: translate(-50px, -80px) scale(1.1) rotate(12deg); }
        35% { transform: translate(110px, 30px) scale(0.75) rotate(-18deg); }
        55% { transform: translate(-80px, 90px) scale(1.3) rotate(22deg); }
        75% { transform: translate(40px, -60px) scale(0.88) rotate(-25deg); }
        90% { transform: translate(-30px, 50px) scale(1.05) rotate(8deg); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
